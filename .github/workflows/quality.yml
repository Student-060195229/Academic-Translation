name: Quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check skill synchronization
        run: python scripts/sync_skill.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
